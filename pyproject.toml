[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "offlook"
version = "0.1.0"
description = "Offline Windows file previews with GUI and CLI interfaces"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]
classifiers = ["Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["build", "twine", "setuptools>=77.0.3"]

[project.scripts]
offlook = "offlook.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["offlook*"]
namespaces = false
