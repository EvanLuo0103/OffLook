[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "offlook"
version = "0.4.1"
description = "Offline Windows file previews with GUI and CLI interfaces"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["dependencies"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.optional-dependencies]
dev = ["build", "twine", "setuptools>=77.0.3"]
office = ["openpyxl==3.1.5", "python-pptx==1.0.2", "docx2pdf==0.1.8; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/EvanLuo0103/OffLook"
Documentation = "https://github.com/EvanLuo0103/OffLook/blob/main/docs/getting-started.md"
Issues = "https://github.com/EvanLuo0103/OffLook/issues"

[project.scripts]
offlook = "offlook.cli:main"
ol = "offlook.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["offlook*"]
namespaces = false
